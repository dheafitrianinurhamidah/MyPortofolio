<!doctype html>
<!-- Template gambar pratinjau tautan (1200×630) untuk LinkedIn/WhatsApp. Dirender oleh tools/render-og.mjs (npm run og). -->
<html lang="id">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap">
  <style>
    :root {
      --bg: #FFF8F2; --ink: #1F2A44; --muted: #5B6475; --accent: #B5502F;
      --accent-ink: #9A4226; --accent-soft: #F7DFD2; --ring: #E0A184; --gold: #E3A857;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 36px;
      align-items: center;
      padding: 0 70px 0 60px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      top: -300px;
      right: -260px;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(247, 223, 210, 0.95), rgba(247, 223, 210, 0) 68%);
    }
    .avatar { position: relative; width: 340px; height: 340px; margin: 50px; }
    .avatar::before, .avatar::after { content: ""; position: absolute; border-radius: 50%; }
    .avatar::before { inset: -7%; background: var(--accent-soft); }
    .avatar::after { inset: -12%; border: 2px dashed var(--ring); }
    .avatar img {
      position: relative; z-index: 1; width: 100%; height: 100%;
      border: 8px solid #fff; border-radius: 50%; object-fit: cover;
      box-shadow: 0 18px 40px rgba(31, 42, 68, 0.18);
    }
    .dot { position: absolute; z-index: 2; border-radius: 50%; background: var(--gold); }
    .text { position: relative; }
    .pill {
      display: inline-block; padding: 8px 18px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-ink); font-size: 22px; font-weight: 700;
    }
    h1 { margin-top: 22px; font-size: 66px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
    h1 em { font-style: normal; color: var(--accent); }
    .role { margin-top: 18px; font-size: 25px; font-weight: 500; color: var(--muted); }
    .focus { margin-top: 22px; font-size: 22px; font-weight: 700; }
    .url { margin-top: 30px; font-size: 22px; font-weight: 700; color: var(--accent); }
  </style>
</head>
<body>
  <div class="avatar">
    <img src="../site/assets/img/profile.jpg" alt="">
    <span class="dot" style="width: 32px; height: 32px; top: 16px; right: 8px;"></span>
    <span class="dot" style="width: 20px; height: 20px; bottom: 44px; left: -8px;"></span>
  </div>
  <div class="text">
    <span class="pill">Bandung, Indonesia</span>
    <h1>Dhea Fitriani<br><em>Nur Hamidah</em></h1>
    <p class="role">Payment Officer · Telkom Corporate University</p>
    <p class="focus">Administrasi · Keuangan · Event · Marketing</p>
    <p class="url">dheafitrianinurhamidah.github.io/MyPortofolio</p>
  </div>
</body>
</html>
